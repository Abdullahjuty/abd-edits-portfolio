<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABD Edits — Admin</title>
    <meta name="robots" content="noindex, nofollow" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body class="admin-body">
    <div id="login-view" class="admin-panel">
      <form id="login-form" class="admin-card">
        <p class="eyebrow">Restricted</p>
        <h1 class="display">Pit crew only</h1>
        <label>Username<input type="text" name="username" autocomplete="username" required /></label>
        <label>Password<input type="password" name="password" autocomplete="current-password" required /></label>
        <p id="login-error" class="admin-error" hidden></p>
        <button class="btn" type="submit">Log in</button>
      </form>
    </div>

    <div id="dashboard-view" class="admin-panel" hidden>
      <header class="admin-header">
        <h1 class="display">Admin dashboard</h1>
        <div>
          <span id="who"></span>
          <button id="logout-btn" class="btn btn-ghost" type="button">Log out</button>
          <a class="btn btn-ghost" href="index.html" target="_blank">View site</a>
        </div>
      </header>

      <section class="admin-card">
        <h2>Upload a new clip</h2>
        <form id="clip-form" class="admin-form">
          <label>Row
            <select name="row" required>
              <option value="rtl">Row 1 · right → left</option>
              <option value="ltr">Row 2 · left → right</option>
              <option value="rtl-slow">Row 3 · right → left (slow)</option>
            </select>
          </label>
          <label>Size
            <select name="size">
              <option value="normal">Normal</option>
              <option value="wide">Wide</option>
              <option value="portrait">Portrait</option>
            </select>
          </label>
          <label>Tag / label<input type="text" name="tag" placeholder="e.g. Brand film" /></label>
          <label>Duration text<input type="text" name="time" placeholder="e.g. 0:32" /></label>
          <label>Video or image file<input type="file" name="media" accept="video/mp4,video/webm,image/jpeg,image/png,image/webp" required /></label>
          <label>Poster image (optional, recommended for videos)<input type="file" name="poster" accept="image/jpeg,image/png,image/webp" /></label>
          <button class="btn" type="submit">Upload clip</button>
          <p class="admin-status" id="clip-status"></p>
        </form>
        <div id="clip-list" class="admin-list"></div>
      </section>

      <section class="admin-card">
        <h2>Testimonials</h2>
        <form id="testimonial-form" class="admin-form">
          <label>Client name<input type="text" name="name" required /></label>
          <label>Role / company<input type="text" name="role" placeholder="e.g. Founder, Northline Co." /></label>
          <label>Quote<textarea name="quote" rows="3" required></textarea></label>
          <label><input type="checkbox" name="featured" /> Feature this one (center spotlight)</label>
          <button class="btn" type="submit">Add testimonial</button>
          <p class="admin-status" id="testimonial-status"></p>
        </form>
        <div id="testimonial-list" class="admin-list"></div>
      </section>

      <section class="admin-card">
        <h2>Pricing plans</h2>
        <div id="pricing-editor"></div>
        <button id="save-pricing" class="btn" type="button">Save pricing</button>
        <p class="admin-status" id="pricing-status"></p>
      </section>

      <section class="admin-card">
        <h2>Hero / VSL</h2>
        <form id="hero-form" class="admin-form">
          <label>Value proposition (3-line headline)<input type="text" name="valueProp" /></label>
          <label>VSL video file<input type="file" name="vslVideo" accept="video/mp4,video/webm" /></label>
          <label>VSL poster image<input type="file" name="vslPoster" accept="image/jpeg,image/png,image/webp" /></label>
          <button class="btn" type="submit">Save hero</button>
          <p class="admin-status" id="hero-status"></p>
        </form>
      </section>
    </div>

    <script src="js/admin.js" defer></script>
  </body>
</html>
